[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findmyclient"
version = "0.1.0"
description = "Find and verify business emails for US medical practices and providers (lead generation for RCM / back-office outsourcing)."
requires-python = ">=3.10"
dependencies = ["dnspython>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
findmyclient = "findmyclient.cli:main"

[tool.setuptools]
packages = ["findmyclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
